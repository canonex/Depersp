name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: ImageMagick with WebP support
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev libmagickcore-6.q16-7-extra

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick, fileinfo, zip
          coverage: none

      - name: Environment
        run: php -r 'echo Imagick::getVersion()["versionString"], PHP_EOL, implode(" ", Imagick::queryFormats("WEBP")), PHP_EOL;'

      - name: Test suite
        run: php -d memory_limit=512M tests/run.php

      - name: Plugin builds
        run: php wordpress/build.php
