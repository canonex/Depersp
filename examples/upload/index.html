<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depersp</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  img { max-width: 100%; border: 1px solid #ccc; margin-top: 1rem; }
  #msg { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Depersp</h1>
<p>Carica la foto di un foglio con una cornice scura: verrà raddrizzata automaticamente.
L'immagine viene elaborata in memoria e non viene salvata sul server.</p>
<form id="f">
  <input type="file" name="image" accept="image/jpeg,image/png,image/webp" capture="environment" required>
  <button>Carica</button>
</form>
<div id="msg"></div>
<p><a id="dl" download="raddrizzata.jpg" hidden>Scarica l'immagine</a></p>
<img id="out" alt="Immagine raddrizzata" hidden>
<script>
let url = null;
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'), out = document.getElementById('out'), dl = document.getElementById('dl');
  msg.textContent = 'Elaborazione…'; out.hidden = dl.hidden = true;
  if (url) { URL.revokeObjectURL(url); url = null; }
  try {
    const r = await fetch('upload.php', { method: 'POST', body: new FormData(e.target) });
    if (r.ok) {
      url = URL.createObjectURL(await r.blob());
      out.src = dl.href = url; out.hidden = dl.hidden = false;
      msg.textContent = `Fatto: ${r.headers.get('X-Depersp-Width')}×${r.headers.get('X-Depersp-Height')}`;
    } else {
      const j = await r.json().catch(() => ({}));
      msg.textContent = j.error === 'no_frame'
        ? 'Cornice non trovata: inquadra tutti e quattro gli angoli.'
        : 'Errore: ' + (j.message || j.error || r.status);
    }
  } catch (err) { msg.textContent = 'Errore di rete'; }
});
</script>
</body>
</html>
