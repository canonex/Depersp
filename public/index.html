<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depersp</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  img { max-width: 100%; border: 1px solid #ccc; margin-top: 1rem; }
  #msg { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Depersp</h1>
<p>Carica la foto di un foglio con una cornice scura: verrà raddrizzata automaticamente.</p>
<form id="f">
  <input type="file" name="image" accept="image/jpeg,image/png,image/webp" capture="environment" required>
  <button>Carica</button>
</form>
<div id="msg"></div>
<img id="out" alt="" hidden>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'), out = document.getElementById('out');
  msg.textContent = 'Elaborazione…'; out.hidden = true;
  try {
    const r = await fetch('upload.php', { method: 'POST', body: new FormData(e.target) });
    const j = await r.json();
    if (j.ok) {
      msg.textContent = `Fatto: ${j.width}×${j.height} in ${j.seconds}s`;
      out.src = j.rectified + '?' + Date.now(); out.hidden = false;
    } else {
      msg.textContent = j.error === 'no_frame' ? 'Cornice non trovata: inquadra tutti e quattro gli angoli.' : 'Errore: ' + (j.message || j.error);
    }
  } catch (err) { msg.textContent = 'Errore di rete'; }
});
</script>
</body>
</html>
